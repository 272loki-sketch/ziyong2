name: wrap-adversarial-switch
on: [push]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'Apply adversarial switch wrapper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/novel-play-foundation
      - run: node scripts/wrap-adversarial-switch.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/novel-play-adversarial.test.ts
          git commit -m "Model created sessions in adversarial hosts"
          git push origin HEAD:feat/novel-play-foundation
