name: One-time novel runtime engine fix

on:
  workflow_dispatch:
  push:
    branches: [feat/novel-play-foundation]
    paths: [.github/workflows/novel-runtime-engine-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/feat/novel-play-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/novel-play-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require clean checkout
        run: test -z "$(git status --porcelain)"
      - name: Apply fixed engine patch
        run: node scripts/novel-integration/engine-patch.mjs
      - name: Assert engine-only change and idempotency
        run: |
          test "$(git diff --name-only)" = "src/stage/engine.ts"
          cp src/stage/engine.ts /tmp/engine.ts
          node scripts/novel-integration/engine-patch.mjs
          cmp /tmp/engine.ts src/stage/engine.ts
      - name: Commit only StageEngine
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- src/stage/engine.ts
          test "$(git diff --cached --name-only)" = "src/stage/engine.ts"
          git commit -m "Harden novel runtime StageEngine guards"
          git push origin HEAD:feat/novel-play-foundation
