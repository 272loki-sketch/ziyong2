name: one-time novel engine integration

on:
  push:
    branches: [feat/novel-play-foundation]
    paths: ['.github/workflows/novel-integrate-engine.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novel-integrate-engine-feat-novel-play-foundation
  cancel-in-progress: false

jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/novel-play-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/novel-play-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard fixed branch and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/novel-play-foundation"
          test "$(git branch --show-current)" = "feat/novel-play-foundation"
          test -z "$(git status --porcelain)"
      - name: Apply fixed engine patch
        run: node scripts/novel-integration/engine-patch.mjs
      - name: Assert exact engine-only change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "src/stage/engine.ts"
          test "$(git diff --name-only --cached)" = ""
          grep -q 'novel-play-runtime-integration-v1' src/stage/engine.ts
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { apply } from './scripts/novel-integration/engine-patch.mjs';
          const source = readFileSync('src/stage/engine.ts', 'utf8');
          if (apply(source) !== source) throw new Error('engine patch is not idempotent');
          NODE
      - name: Commit engine integration only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/stage/engine.ts
          test "$(git diff --name-only --cached)" = "src/stage/engine.ts"
          git commit -m "Integrate novel branch candidates into StageEngine"
          git push origin HEAD:feat/novel-play-foundation
