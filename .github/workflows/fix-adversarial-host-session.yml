name: fix-adversarial-host-session
on: [push]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'Apply adversarial host session correction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/novel-play-foundation
      - run: node scripts/fix-adversarial-host-session.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/novel-play-adversarial.test.ts
          git commit -m "Align adversarial host with created sessions"
          git push origin HEAD:feat/novel-play-foundation
