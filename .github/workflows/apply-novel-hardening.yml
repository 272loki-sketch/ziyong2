name: Apply durable novel API hardening
on:
  push:
    branches: [feat/novel-play-foundation]
permissions:
  contents: write
jobs:
  test-fix:
    if: github.event.head_commit.message == 'Execute deterministic novel test migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/novel-play-foundation
      - name: Commit owned test corrections then verify
        run: |
          python scripts/fix-novel-hardening-tests.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/novel-play-api.test.ts test/novel-play-api-audit.test.ts
          git commit -m "Align novel API tests with runtime card binding"
          git push origin HEAD:feat/novel-play-foundation
          node --test --test-reporter=./scripts/test-summary.mjs test/novel-play*.test.ts
