name: start-lock-repair
on: [push]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'Execute deterministic start lock repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/novel-play-foundation
      - run: python scripts/fix-start-lock-order.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/novel-play-api.ts
          git commit -m "Check novel start lock before runtime binding"
          git push origin HEAD:feat/novel-play-foundation
