name: Fix novel API blockers
on:
  push:
    branches: [feat/novel-play-foundation]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'Trigger novel API blocker repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/novel-play-foundation
      - name: Apply blocker fixes
        shell: bash
        run: |
          git show HEAD^:.github/workflows/fix-novel-api-blockers.yml > /tmp/original.yml
          sed -n '/cat > \/tmp\/fix.py/,/python \/tmp\/fix.py/p' /tmp/original.yml | sed '$d' > /tmp/run-fix.sh
          bash /tmp/run-fix.sh
          node --test --test-reporter=./scripts/test-summary.mjs test/novel-play*.test.ts
          node -e "import('./scripts/novel-integration/server-patch.mjs').then(({apply})=>{const fs=require('fs');const s=fs.readFileSync('server/rest.ts','utf8');if(apply(s)!==s||apply(apply(s))!==s)process.exit(1)})"
          git rm .github/workflows/fix-novel-api-blockers.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/novel-play/application.ts server/novel-play-api.ts test/novel-play-api-audit.test.ts
          git commit -m "Harden novel API admission and switch recovery"
          git push origin HEAD:feat/novel-play-foundation
