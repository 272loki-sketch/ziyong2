name: Fix novel API blockers
on:
  push:
    branches: [feat/novel-play-foundation]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'Finalize novel API blocker repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/novel-play-foundation
          fetch-depth: 8
      - name: Apply and verify fixes
        shell: bash
        run: |
          git show e28b0ffc1f6e29ff5148db9f14ca70aace24ec07:.github/workflows/fix-novel-api-blockers.yml > /tmp/original.yml
          sed -n '/cat > \/tmp\/fix.py/,/python \/tmp\/fix.py/p' /tmp/original.yml | sed '$d' | sed 's/^          //' > /tmp/run-fix.sh
          bash /tmp/run-fix.sh
          python /tmp/fix.py
          python - <<'PY'
          from pathlib import Path
          p=Path('test/novel-play-api.test.ts'); s=p.read_text()
          old='''function host(root: string, model: (system: string, user: string) => string): RestHost {
\treturn { cwd: root, isStreaming: () => false, runSideText: async (_step, system, user) => model(system, user), memoryScope: () => ({ sessionId: "test", card: "assets/cards/default_Qingwu.json" }), switchToCard: async () => "created" } as unknown as RestHost;
}'''
          new='''function host(root: string, model: (system: string, user: string) => string): RestHost {
\tlet runtimeCard = "assets/cards/default_Qingwu.json";
\treturn { cwd: root, isStreaming: () => false, runSideText: async (_step, system, user) => model(system, user), memoryScope: () => ({ sessionId: "test", card: runtimeCard }), switchToCard: async () => { runtimeCard = JSON.parse(readFileSync(join(root, "liyuan.config.json"), "utf8")).card; return "created"; } } as unknown as RestHost;
}'''
          assert old in s; p.write_text(s.replace(old,new))
          p=Path('test/novel-play-api-audit.test.ts'); s=p.read_text()
          s=s.replace('const start = api.indexOf("await startFromConfirmedProposal", consume);','const start = api.indexOf("startFromConfirmedProposal", consume);')
          s=s.replace('assert.match(application, /memoryScope\\(\\)\\.sessionId/);','assert.match(application, /const scope = host\\.memoryScope\\(\\)/);\n\tassert.match(application, /const sessionId = scope\\.sessionId/);')
          p.write_text(s)
          PY
          node --test --test-reporter=./scripts/test-summary.mjs test/novel-play*.test.ts
          node -e "import('./scripts/novel-integration/server-patch.mjs').then(({apply})=>{const fs=require('fs');const s=fs.readFileSync('server/rest.ts','utf8');if(apply(s)!==s||apply(apply(s))!==s)process.exit(1)})"
          git rm .github/workflows/fix-novel-api-blockers.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/novel-play/application.ts server/novel-play-api.ts test/novel-play-api.test.ts test/novel-play-api-audit.test.ts
          git commit -m "Harden novel API admission and switch recovery"
          git push origin HEAD:feat/novel-play-foundation
