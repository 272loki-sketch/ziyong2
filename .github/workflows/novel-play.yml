name: novel-play verification
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fixed-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/novel-play-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fixed exact replacements
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          function replaceOne(path, oldText, newText) {
            const source = readFileSync(path, 'utf8');
            if (source.indexOf(oldText) < 0 || source.indexOf(oldText) !== source.lastIndexOf(oldText)) throw new Error(`anchor mismatch: ${path}`);
            writeFileSync(path, source.replace(oldText, newText), 'utf8');
          }
          replaceOne('src/novel-play/application.ts', `function awaitFingerprint(text: string): string {
	return new BunlessHash("sha256").update(text).digest();
}

class BunlessHash {
	#chunks = "";
	constructor(private readonly algorithm: string) {}
	update(value: string): this { this.#chunks += value; return this; }
	digest(): string {
		if (this.algorithm !== "sha256") throw new Error("unsupported hash");
		return requireHash(this.#chunks);
	}
}

function requireHash(value: string): string {
	// Kept behind a function so tests can exercise source validation without exposing source text.
	return createSha256(value);
}

import { createHash } from "node:crypto";
const createSha256 = (value: string): string => createHash("sha256").update(value, "utf8").digest("hex");`, `function awaitFingerprint(text: string): string {
	return createSha256(text);
}

import { createHash } from "node:crypto";
const createSha256 = (value: string): string => createHash("sha256").update(value, "utf8").digest("hex");`);
          replaceOne('test/novel-play-api.test.ts', `const ref = { chunkIndex: 0, start: text.indexOf("晨钟"), end: text.indexOf("晨钟") + 4, quote: "晨钟响起" };`, `const quote = "晨钟响起。旅人推开城门。";
	const ref = { chunkIndex: 0, start: text.indexOf(quote), end: text.indexOf(quote) + quote.length, quote };`);
          NODE
      - name: Commit owned repairs only
        run: |
          test "$(git diff --name-only | sort)" = "$(printf 'src/novel-play/application.ts\ntest/novel-play-api.test.ts')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/novel-play/application.ts test/novel-play-api.test.ts
          git commit -m 'Fix native TypeScript API test compatibility'
          git push origin HEAD:feat/novel-play-foundation
