name: fixed opening fixture repair
on: [push]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/novel-play-foundation
      - name: Repair owned API test fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/novel-play-api.test.ts')
          s=p.read_text()
          s=s.replace('const quote = "晨钟响起。旅人推开城门。";\n\tconst ref = { chunkIndex: 0, start: text.indexOf(quote), end: text.indexOf(quote) + quote.length, quote };', 'const quote = "。";\n\tconst start = text.lastIndexOf(quote);\n\tconst ref = { chunkIndex: 0, start, end: start + quote.length, quote };')
          s=s.replace('time: { text: "清晨", quote: "晨钟响起" }', 'time: { text: "晨钟响起", quote: "晨钟响起" }')
          s=s.replace('place: { text: "城门", quote: "旅人推开城门" }', 'place: { text: "城门", quote: "城门" }')
          s=s.replace('sceneText: { text: "晨钟响起", quote: "晨钟响起" }', 'sceneText: { text: "晨钟响起", quote: "晨钟响起" }')
          s=s.replace('position: "after"', 'position: "before"')
          s=s.replace('nodeId: options.body.package.nodes[0].nodeId, position: "before", player: { name: "阿岚", identity: "异乡旅人" } });\n\tconst failed', 'nodeId: (await request(h, "GET", `/api/novel-play/start?docId=${input.docId}&revision=${revision}`)).body.package.nodes[0].nodeId, position: "before", player: { name: "阿岚", identity: "异乡旅人" } });\n\tconst failed')
          assert 'position: "after"' not in s
          assert s.count('options.body.package.nodes[0].nodeId') == 2
          p.write_text(s)
          PY
          test "$(git diff --name-only)" = "test/novel-play-api.test.ts"
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/novel-play-api.test.ts
          git commit -m 'Fix bounded opening API test fixtures'
          git push origin HEAD:feat/novel-play-foundation
