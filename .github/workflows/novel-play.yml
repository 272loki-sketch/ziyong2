name: fixed canonical node ID repair
on: [push]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/novel-play-foundation
      - name: Repair owned API test
        run: |
          python3 -c 'from pathlib import Path; p=Path("test/novel-play-api.test.ts"); s=p.read_text(); s=s.replace("import { prepareNovelSource } from \"../src/novel-play/source.ts\";", "import { novelNodeId, prepareNovelSource } from \"../src/novel-play/source.ts\";"); s=s.replace("id: \"canon-node\", key: \"bell\"", "id: novelNodeId(source, ref, \"bell\"), key: \"bell\""); s=s.replace("[{ nodeId: \"canon-node\", title: \"晨钟\" }]", "[{ nodeId: options.body.package.nodes[0].nodeId, title: \"晨钟\" }]"); s=s.replace("nodeId: \"canon-node\", position:", "nodeId: options.body.package.nodes[0].nodeId, position:"); assert "canon-node" not in s; p.write_text(s)'
          test "$(git diff --name-only)" = "test/novel-play-api.test.ts"
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/novel-play-api.test.ts
          git commit -m 'Use canonical novel node IDs in API tests'
          git push origin HEAD:feat/novel-play-foundation
