name: fixed audit regression repair
on:
  push:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/novel-play-foundation
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server/novel-play-api.ts'); s=p.read_text()
          old='''const close = () => { if (!res.writableEnded) abort(); }; if (req.aborted) abort(); req.once("aborted", abort); res.once("close", close); return { signal: controller.signal, cleanup: () => { req.off("aborted", abort); res.off("close", close); } };'''
          new='''const close = () => { if (!res.writableEnded) abort(); }; if (req.aborted) abort(); req.once("aborted", abort); const responseEvents = res as ServerResponse & { once?: (event: string, listener: () => void) => unknown; off?: (event: string, listener: () => void) => unknown }; responseEvents.once?.("close", close); return { signal: controller.signal, cleanup: () => { req.off("aborted", abort); responseEvents.off?.("close", close); } };'''
          if old not in s: raise SystemExit('response event anchor absent')
          p.write_text(s.replace(old,new))
          p=Path('test/novel-play-api.test.ts'); s=p.read_text()
          s=s.replace('test("failed card switch rolls config back and removes generated card"', 'test("post-side-effect failure preserves recovery state"')
          s=s.replace('(h as unknown as { switchToCard(): Promise<string> }).switchToCard = async () => { throw new Error("switch failed"); };', '(h as unknown as { switchToCard(): Promise<string> }).switchToCard = async () => { throw new Error("post-side-effect failure"); };')
          s=s.replace('''\tassert.equal(failed.status, 400);
\tassert.equal(readFileSync(join(root, "liyuan.config.json"), "utf8"), original);''', '''\tassert.equal(failed.status, 202);
\tassert.equal(failed.body.started.session, "recovery-required");
\tassert.notEqual(readFileSync(join(root, "liyuan.config.json"), "utf8"), original);
\tassert.ok(readFileSync(join(root, failed.body.started.card), "utf8").includes("liyuanNovelPlay"));''')
          p.write_text(s)
          p=Path('test/novel-play-ui.test.ts'); s=p.read_text()
          old='/nodes: value\\.package\\.nodes\\.filter\\(\\(node\\) => node\\.visibility === "public"\\)\\.map\\(\\(node\\) => \\(\\{ nodeId: node\\.id, title: node\\.title \\}\\)\\)/'
          new='/nodes: value\\.package\\.nodes\\.filter[\\s\\S]*title: `阶段 \\${stages\\.get\\(node\\.stageId\\) \\?\\? 0} · 节点 \\${node\\.order \\+ 1}`/'
          if old not in s: raise SystemExit('UI assertion anchor absent')
          p.write_text(s.replace(old,new))
          PY
          test "$(git diff --name-only | sort)" = $'server/novel-play-api.ts\ntest/novel-play-api.test.ts\ntest/novel-play-ui.test.ts'
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/novel-play-api.ts test/novel-play-api.test.ts test/novel-play-ui.test.ts
          git commit -m 'Fix disconnect harness and recovery regressions'
          git push origin HEAD:feat/novel-play-foundation
