name: fixed audit patch
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/novel-play-foundation
      - run: node --input-type=module -e "import fs from 'node:fs'; import {apply} from './scripts/novel-integration/server-patch.mjs'; const p='server/rest.ts'; const a=apply(fs.readFileSync(p,'utf8')); if(apply(a)!==a) throw Error('not idempotent'); fs.writeFileSync(p,a);"
      - run: |
          python3 -c 'from pathlib import Path; p=Path("test/novel-play-api.test.ts"); s=p.read_text(); s=s.replace("title: \"晨钟\" }]);", "title: \"阶段 1 · 节点 1\" }]);"); p.write_text(s)'
          test "$(git diff --name-only | sort)" = $'server/rest.ts\ntest/novel-play-api.test.ts'
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/rest.ts test/novel-play-api.test.ts
          git commit -m 'Apply novel play audit guard and safe labels'
          git push origin HEAD:feat/novel-play-foundation
