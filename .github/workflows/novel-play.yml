name: fixed disconnect compatibility repair
on: [push]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/novel-play-foundation
      - name: Repair mock response compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server/novel-play-api.ts')
          s=p.read_text()
          old='const close = () => { if (!res.writableEnded) abort(); }; if (req.aborted) abort(); req.once("aborted", abort); res.once("close", close); return { signal: controller.signal, cleanup: () => { req.off("aborted", abort); res.off("close", close); } };'
          new='const close = () => { if (!res.writableEnded) abort(); }; if (req.aborted) abort(); req.once("aborted", abort); const responseEvents = res as ServerResponse & { once?: (event: string, listener: () => void) => unknown; off?: (event: string, listener: () => void) => unknown }; responseEvents.once?.("close", close); return { signal: controller.signal, cleanup: () => { req.off("aborted", abort); responseEvents.off?.("close", close); } };'
          if old not in s: raise SystemExit('anchor absent')
          p.write_text(s.replace(old,new))
          PY
          test "$(git diff --name-only)" = "server/novel-play-api.ts"
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/novel-play-api.ts
          git commit -m 'Support minimal API response harnesses'
          git push origin HEAD:feat/novel-play-foundation
