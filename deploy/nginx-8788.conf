# This file stays as a server{} fragment.
# Define $connection_upgrade once in the main nginx.conf http{} context before
# including this file, for example:
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }

server {
    listen 8788 ssl;
    http2 on;
    server_name <PUBLIC_HOST_OR_IP>;

    ssl_certificate /www/server/panel/vhost/cert/<PUBLIC_HOST_OR_IP>/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/<PUBLIC_HOST_OR_IP>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LIYUAN_SSL:10m;
    ssl_session_timeout 10m;

    auth_basic "<BASIC_AUTH_REALM>";
    auth_basic_user_file /www/server/nginx/conf/htpasswd/<APP_NAME>-8788;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:7620;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }

    access_log /www/wwwlogs/<APP_NAME>-8788.log;
    error_log /www/wwwlogs/<APP_NAME>-8788.error.log;
}
