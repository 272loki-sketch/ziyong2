services:
  liyuan:
    build:
      context: ..
      dockerfile: Dockerfile
    image: liyuan:local
    container_name: liyuan
    restart: unless-stopped
    ports:
      - "127.0.0.1:7620:7620"
    environment:
      HOST: "0.0.0.0"
      PORT: "7620"
      LIYUAN_WEB_RESEARCH_PROXY: "http://172.17.0.1:7890"
      NO_PROXY: "localhost,127.0.0.1"
    volumes:
      - liyuan-agent:/root/.liyuan
      - liyuan-state:/app/.liyuan-state
      - liyuan-uploads:/app/.liyuan-uploads
      - liyuan-media:/app/.liyuan-media
      - liyuan-audio:/app/.liyuan-audio
      - liyuan-artifacts:/app/.liyuan-artifacts
      - liyuan-codex:/app/.liyuan-codex
      - liyuan-lore:/app/.liyuan-lore
      - ./data/config:/app/config
      - ./data/cards:/app/assets/cards
      - ./data/lorebooks:/app/assets/lorebooks
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7620/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  liyuan-agent:
  liyuan-state:
  liyuan-uploads:
  liyuan-media:
  liyuan-audio:
  liyuan-artifacts:
  liyuan-codex:
  liyuan-lore:
